<!doctype html>
<html lang="ja" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>委譲で横に分割 — アニメーションモック</title>
    <style>
      @font-face {
        font-family: "Noto Sans JP";
        src: url("../../src/client/assets/fonts/NotoSansJP-Variable.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      @font-face {
        font-family: "Nerd Symbols Mono";
        src: url("../../src/client/assets/fonts/NerdSymbolsMono.woff2") format("woff2");
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --color-bg: #101215;
        --color-surface: #1b1e23;
        --color-raised: #262a31;
        --color-content: #131619;
        --color-text: #f2f4f7;
        --color-secondary: #a3aab5;
        --color-accent: #94baff;
        --color-on-accent: #101215;
        --color-selected: #23334e;
        --color-line: #32373f;
        --color-control-line: #606976;
        --color-neutral: #b6becb;
        --color-neutral-bg: #2b2f36;
        --color-success: #8fdbb1;
        --color-slot-1: #7aa7ff;
        --color-slot-2: #b79bff;
        --color-slot-3: #6fcbd6;
        --color-slot-4: #f38fbe;
        --font-ui:
          "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
          "Yu Gothic UI", "Noto Sans", sans-serif;
        --font-mono:
          ui-monospace, "SFMono-Regular", Consolas, "BIZ UDGothic", "Nerd Symbols Mono", monospace;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --radius-sm: 8px;
        --radius-icon: 10px;
        --radius-control: 12px;
        --line-body: 1.5;
        --split-dur: 280ms;
        --split-fade: 160ms;
        --split-delay: 70ms;
        --split-ease: cubic-bezier(0.25, 0.72, 0.3, 1);
      }

      /* 動きを確かめるときは、分割だけをゆっくりにする。 */
      :root[data-slow="true"] {
        --split-dur: 760ms;
        --split-fade: 420ms;
        --split-delay: 200ms;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --color-bg: #f4f5f7;
        --color-surface: #ffffff;
        --color-raised: #eef0f3;
        --color-content: #ffffff;
        --color-text: #18212f;
        --color-secondary: #5d6878;
        --color-accent: #255cd6;
        --color-on-accent: #ffffff;
        --color-selected: #e9f0ff;
        --color-line: #dce0e7;
        --color-control-line: #8490a1;
        --color-neutral: #5d6878;
        --color-neutral-bg: #eef0f3;
        --color-success: #216549;
        --color-slot-1: #255cd6;
        --color-slot-2: #7048c8;
        --color-slot-3: #157f8d;
        --color-slot-4: #b0447a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        margin: 0;
        overflow: hidden;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-ui);
        font-size: 16px;
        line-height: var(--line-body);
        -webkit-font-smoothing: antialiased;
      }

      button {
        font: inherit;
        color: inherit;
      }

      svg {
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* 見出し */

      .mock-head {
        display: flex;
        flex: none;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-4);
        height: 64px;
        padding: 0 var(--space-5);
        border-bottom: 1px solid var(--color-line);
        background: var(--color-surface);
      }

      .mock-title {
        display: flex;
        align-items: baseline;
        gap: var(--space-3);
        min-width: 0;
      }

      .badge {
        flex: none;
        padding: 1px 8px;
        border: 1px solid var(--color-line);
        border-radius: 999px;
        color: var(--color-secondary);
        font-size: 11px;
        line-height: 18px;
        white-space: nowrap;
      }

      .mock-title h1 {
        flex: none;
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.3;
      }

      .mock-title p {
        margin: 0;
        overflow: hidden;
        color: var(--color-secondary);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mock-tools {
        display: flex;
        flex: none;
        align-items: center;
        gap: var(--space-2);
      }

      .mock-tools button {
        height: 32px;
        padding: 0 12px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-sm);
        background: var(--color-surface);
        font-size: 12px;
        white-space: nowrap;
        cursor: pointer;
      }

      .mock-tools button:hover {
        background: var(--color-raised);
      }

      .mock-tools button[aria-pressed="true"] {
        border-color: var(--color-accent);
        background: var(--color-selected);
        color: var(--color-text);
      }

      .mock-tools button:disabled {
        color: var(--color-secondary);
        opacity: 0.55;
        cursor: default;
      }

      .mock-tools .primary {
        border-color: var(--color-accent);
        color: var(--color-accent);
        font-weight: 600;
      }

      /* 詳細 */

      .detail {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-height: 0;
      }

      .tabbar {
        display: flex;
        flex: none;
        align-items: center;
        gap: var(--space-2);
        height: 52px;
        padding: var(--space-2) var(--space-3) var(--space-1);
        border-bottom: 1px solid var(--color-line);
        overflow: hidden;
      }

      .icon-button {
        display: grid;
        flex: none;
        place-items: center;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: var(--radius-icon);
        background: transparent;
        color: var(--color-secondary);
        cursor: pointer;
      }

      .icon-button:hover {
        background: var(--color-raised);
      }

      .tabs {
        display: flex;
        gap: 2px;
        min-width: 0;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .tabs::-webkit-scrollbar {
        display: none;
      }

      .tab-item {
        position: relative;
        display: flex;
        flex: none;
        align-items: center;
        border-radius: var(--radius-icon);
      }

      .tab-item:hover {
        background: var(--color-raised);
      }

      .tab-item[data-selected="true"] {
        background: var(--color-surface);
        box-shadow: inset 0 0 0 1px var(--color-line);
      }

      .tab-item[data-new="true"] {
        animation: tab-in 220ms var(--split-ease);
      }

      /* スロット色はタブとセルで共有する。グリッド外のタブは無色。 */
      .tab-item[data-slot]::before {
        content: "";
        position: absolute;
        top: 10px;
        bottom: 10px;
        left: 4px;
        width: 3px;
        border-radius: 2px;
        background: var(--slot);
      }

      .tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 36px;
        padding: 0 var(--space-3);
        border: 0;
        background: transparent;
        color: var(--color-secondary);
        font-size: 13px;
        white-space: nowrap;
        cursor: pointer;
      }

      .tab-item[data-slot] .tab {
        padding-left: var(--space-4);
      }

      .tab-item[data-selected="true"] .tab {
        color: var(--color-text);
        font-weight: 600;
      }

      .tab[data-detached="true"] {
        color: var(--color-secondary);
      }

      /* 状態は色だけでなく形でも分ける。 */
      .tab-status {
        display: grid;
        flex: none;
        place-items: center;
        width: 12px;
        height: 12px;
        color: var(--color-neutral);
      }

      .tab-status[data-status="working"] {
        color: var(--color-accent);
      }

      .tab-status[data-status="done"] {
        color: var(--color-success);
      }

      .tab-status[data-status="working"] svg {
        animation: turn 0.9s linear infinite;
      }

      .tab-status svg {
        width: 12px;
        height: 12px;
      }

      @keyframes turn {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes tab-in {
        from {
          opacity: 0;
          transform: translateX(-6px);
        }
      }

      .stage {
        display: flex;
        flex: 1;
        min-height: 0;
        background: var(--color-bg);
      }

      .split {
        display: flex;
        flex: 1 1 0%;
        gap: 1px;
        min-width: 0;
        min-height: 0;
        background: var(--color-line);
      }

      .split[data-dir="row"] {
        flex-direction: row;
      }

      .split[data-dir="col"] {
        flex-direction: column;
      }

      .cell {
        position: relative;
        display: flex;
        flex: 1 1 0%;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: var(--color-content);
        transition: flex-grow var(--split-dur) var(--split-ease);
      }

      /* 新しいセルは分割線の側から広がる。中身は少し遅れて滑り込む。 */
      .cell[data-new="true"] {
        flex-grow: 0;
      }

      /* 複数セルのときだけ枠を出す。選択中は 2px、他は 1px。 */
      .cell::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 3;
        border: 1px solid color-mix(in oklab, var(--slot) 32%, transparent);
        pointer-events: none;
      }

      .cell[data-current="true"]::after {
        border-width: 2px;
        border-color: var(--slot);
      }

      .stage[data-single="true"] .cell::after {
        border: 0;
      }

      /* 分割線が走る瞬間だけ、スロット色の線を引く。 */
      .cell::before {
        content: "";
        position: absolute;
        z-index: 4;
        background: var(--slot);
        opacity: 0;
        transition: opacity 460ms ease-out;
        pointer-events: none;
      }

      .cell[data-dir="row"]::before {
        top: 0;
        bottom: 0;
        left: 0;
        width: 1px;
      }

      .cell[data-dir="col"]::before {
        top: 0;
        right: 0;
        left: 0;
        height: 1px;
      }

      .cell[data-new="true"]::before {
        opacity: 0.85;
        transition: none;
      }

      .cell-inner {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-height: 0;
        transition:
          opacity var(--split-fade) ease-out var(--split-delay),
          transform var(--split-dur) var(--split-ease);
      }

      .cell[data-new="true"] .cell-inner {
        opacity: 0;
        transform: translateX(10px);
        transition: none;
      }

      .cell[data-dir="col"][data-new="true"] .cell-inner {
        transform: translateY(10px);
      }

      .cell-head {
        display: flex;
        flex: none;
        align-items: center;
        gap: var(--space-2);
        min-height: 40px;
        padding: 0 var(--space-4);
        color: var(--color-secondary);
        font-size: 12px;
        overflow: hidden;
      }

      .cell-head .agent {
        display: grid;
        flex: none;
        place-items: center;
        width: 16px;
        height: 16px;
        color: var(--agent);
      }

      .cell-head .name {
        overflow: hidden;
        color: var(--color-text);
        font-size: 13px;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .cell-head .branch {
        overflow: hidden;
        font-family: var(--font-mono);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .cell-head .spacer {
        flex: 1;
      }

      .cell-head .kind {
        flex: none;
        padding: 0 7px;
        border: 1px solid var(--color-line);
        border-radius: 999px;
        font-size: 10px;
        line-height: 17px;
      }

      .cell-output {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: var(--space-1) var(--space-4) var(--space-3);
        scrollbar-width: thin;
      }

      .msg {
        max-width: 40rem;
        margin: 0 auto;
        font-size: 13.5px;
        line-height: 1.75;
      }

      .msg + .msg {
        margin-top: var(--space-3);
        padding-top: var(--space-3);
        border-top: 1px solid color-mix(in oklab, var(--color-line) 60%, transparent);
      }

      .msg p {
        margin: 0;
      }

      .msg-meta {
        margin-top: 2px;
        color: var(--color-secondary);
        font-size: 11px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: var(--space-2);
        padding: 2px 9px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-sm);
        color: var(--color-text);
        font-size: 11px;
      }

      .chip::before {
        content: "";
        width: 3px;
        height: 11px;
        border-radius: 2px;
        background: var(--slot);
      }

      .composer {
        flex: none;
        padding: var(--space-2) var(--space-4) var(--space-3);
        border-top: 1px solid var(--color-line);
      }

      .composer-line {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        max-width: 40rem;
        margin: 0 auto;
      }

      .composer-field {
        flex: 1;
        min-width: 0;
        height: 32px;
        padding: 5px 0;
        border: 0;
        background: transparent;
        color: var(--color-text);
        font: inherit;
        font-size: 13px;
        outline: none;
      }

      .composer-field::placeholder {
        color: var(--color-secondary);
      }

      .send {
        display: grid;
        flex: none;
        place-items: center;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: var(--radius-icon);
        background: var(--color-accent);
        color: var(--color-on-accent);
        cursor: pointer;
      }

      /* 状態の帯 */

      .eventbar {
        display: flex;
        flex: none;
        align-items: center;
        gap: var(--space-3);
        height: 38px;
        padding: 0 var(--space-5);
        border-top: 1px solid var(--color-line);
        background: var(--color-surface);
        color: var(--color-secondary);
        font-size: 12px;
      }

      .eventbar .spacer {
        flex: 1;
      }

      .eventbar b {
        color: var(--color-text);
        font-weight: 600;
      }

      .eventbar .mock-note {
        font-family: var(--font-mono);
        font-size: 11px;
      }

      @media (prefers-reduced-motion: reduce) {
        .cell {
          transition: none;
        }

        .cell-inner {
          transition: none;
        }

        .cell::before {
          transition: none;
        }

        .tab-item[data-new="true"] {
          animation: none;
        }

        .tab-status[data-status="working"] svg {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <header class="mock-head">
      <div class="mock-title">
        <span class="badge">プレビュー</span>
        <h1>委譲で横に分割</h1>
        <p>impl に委譲が届くと、新しいペインが分割線から滑り出ます（PC のみ・4 枚まで）</p>
      </div>
      <div class="mock-tools">
        <button type="button" class="primary" id="delegate">委譲（review へ）</button>
        <button type="button" id="play">連続再生</button>
        <button type="button" id="slow" aria-pressed="false" title="分割の動きをゆっくりにする">
          ゆっくり
        </button>
        <button type="button" id="reset">1 枚に戻す</button>
        <button type="button" id="theme">ライト</button>
      </div>
    </header>

    <main class="detail">
      <div class="tabbar">
        <button type="button" class="icon-button" aria-label="一覧へ戻る">
          <svg width="18" height="18" viewBox="0 0 24 24" stroke-width="1.7" aria-hidden="true">
            <path d="M15 5l-7 7 7 7" />
          </svg>
        </button>
        <div class="tabs" id="tabs" role="tablist" aria-label="開いているペイン"></div>
      </div>
      <div class="stage" id="stage" data-single="true"></div>
      <p class="eventbar" id="eventbar" role="status" aria-live="polite">
        <span id="event">1 枚表示。委譲はまだありません。</span>
        <span class="spacer"></span>
        <span class="mock-note">mock / 実処理なし</span>
      </p>
    </main>

    <script>
      const PANES = {
        impl: {
          name: "impl",
          agent: "pi",
          kind: "pi",
          status: "working",
          branch: "feat/delegate-split",
          messages: [
            "review に差分の確認を、ui-test に E2E を頼みます。",
            "どちらも同じワークツリーで動いています。",
          ],
        },
        review: {
          name: "review",
          agent: "claude",
          kind: "claude",
          status: "working",
          branch: "feat/delegate-split",
          messages: [
            "委譲を受け取りました。分割の境界から確認します。",
            "1px の gap で揃っています。入力欄の折り返しだけ見ています。",
          ],
        },
        "ui-test": {
          name: "ui-test",
          agent: "codex",
          kind: "codex",
          status: "working",
          branch: "feat/delegate-split",
          messages: ["E2E を流しています。", "3 件中 2 件が完了しました。"],
        },
        docs: {
          name: "docs",
          agent: "pi",
          kind: "pi",
          status: "idle",
          branch: "feat/delegate-split",
          messages: ["README の更新は完了しています。", "差分はレビュー待ちです。"],
        },
        e2e: {
          name: "e2e",
          agent: "opencode",
          kind: "opencode",
          status: "idle",
          branch: "feat/delegate-split",
          messages: ["追加の E2E を待機しています。"],
        },
      };

      const AGENT_COLOR = {
        pi: "#8ab4ff",
        claude: "#e08a68",
        codex: "#8fdbb1",
        opencode: "#b79bff",
      };

      const STATUS_ICON = {
        working: `<svg viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg>`,
        idle: `<svg viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>`,
        done: `<svg viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>`,
      };

      // 委譲の順。ペインは必ず、いま親が入っているセルを割って増える。
      const STEPS = [
        { pane: "review", target: "impl", dir: "row", label: "review へ委譲" },
        { pane: "ui-test", target: "impl", dir: "col", label: "ui-test へ委譲" },
        { pane: "docs", target: "review", dir: "col", label: "docs へ委譲" },
        { pane: "e2e", target: null, dir: null, label: "e2e へ委譲" },
      ];

      const stage = document.querySelector("#stage");
      const tabsEl = document.querySelector("#tabs");
      const eventEl = document.querySelector("#event");
      const delegateBtn = document.querySelector("#delegate");
      const playBtn = document.querySelector("#play");
      const resetBtn = document.querySelector("#reset");
      const slowBtn = document.querySelector("#slow");
      const themeBtn = document.querySelector("#theme");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      const leaf = (pane) => ({ kind: "leaf", pane });

      let layout;
      let tabs;
      let current;
      let step;
      let timers = [];

      function resetState() {
        for (const id of timers) clearTimeout(id);
        timers = [];
        panesPending = null;
        layout = leaf("impl");
        tabs = ["impl"];
        current = "impl";
        step = 0;
      }

      function leafPanes(node) {
        return node.kind === "leaf" ? [node.pane] : node.children.flatMap(leafPanes);
      }

      // 各セルの画面位置。等分の分割なので、x / y だけで読み順を出せる。
      function boxes(node, x, y, out) {
        if (node.kind === "leaf") {
          out.push({ pane: node.pane, x, y });
          return out;
        }
        node.children.forEach((child, index) => {
          if (node.dir === "row") boxes(child, x + index / node.children.length, y, out);
          else boxes(child, x, y + index / node.children.length, out);
        });
        return out;
      }

      function readingOrder() {
        return boxes(layout, 0, 0, [])
          .sort((a, b) => a.y - b.y || a.x - b.x)
          .map((box) => box.pane);
      }

      function slotOf(pane) {
        const order = readingOrder();
        if (order.length < 2) return 0;
        return order.indexOf(pane) + 1;
      }

      function insertAfter(node, target, pane, dir) {
        if (node.kind === "leaf") {
          return node.pane === target ? { kind: "split", dir, children: [node, leaf(pane)] } : node;
        }
        return {
          ...node,
          children: node.children.map((child) => insertAfter(child, target, pane, dir)),
        };
      }

      function agentIcon(kind) {
        const color = AGENT_COLOR[kind] ?? "var(--color-secondary)";
        return `<span class="agent" style="--agent:${color}">
          <svg width="16" height="16" viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true">
            <path d="M7 8l5 4-5 4M13 16h4"/>
          </svg>
        </span>`;
      }

      function cellHTML(pane) {
        const p = PANES[pane];
        const messages = p.messages.map((text) => `<div class="msg"><p>${text}</p></div>`).join("");
        return `
          <div class="cell-inner">
            <header class="cell-head">
              ${agentIcon(p.kind)}
              <span class="name">${p.name}</span>
              <span class="branch">${p.branch}</span>
              <span class="spacer"></span>
              <span class="kind">${p.kind}</span>
            </header>
            <div class="cell-output">
              ${messages}
              <div class="msg"><span class="chip">${p.name} が担当</span></div>
            </div>
            <form class="composer" onsubmit="return false">
              <div class="composer-line">
                <input class="composer-field" type="text" placeholder="メッセージを入力" aria-label="${p.name} へ送る" />
                <button type="button" class="send" aria-label="送信">
                  <svg width="15" height="15" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true">
                    <path d="M12 19V5M6 11l6-6 6 6"/>
                  </svg>
                </button>
              </div>
            </form>
          </div>`;
      }

      function renderCell(pane, parentDir, newPane) {
        const cell = document.createElement("section");
        const slot = slotOf(pane);
        cell.className = "cell";
        cell.dataset.pane = pane;
        cell.dataset.current = String(pane === current);
        cell.dataset.dir = parentDir;
        cell.dataset.new = String(pane === newPane);
        if (slot > 0) cell.style.setProperty("--slot", `var(--color-slot-${slot})`);
        else cell.style.setProperty("--slot", "transparent");
        cell.innerHTML = cellHTML(pane);
        return cell;
      }

      function renderNode(node, newPane) {
        if (node.kind === "leaf") return renderCell(node.pane, node.parentDir, newPane);
        const el = document.createElement("div");
        el.className = "split";
        el.dataset.dir = node.dir;
        for (const child of node.children) {
          const childEl = renderNode(
            child.kind === "leaf" ? { ...child, parentDir: node.dir } : child,
            newPane,
          );
          el.append(childEl);
        }
        return el;
      }

      function renderTabs(newPane) {
        const fixed = readingOrder();
        const order = [...fixed, ...tabs.filter((pane) => !fixed.includes(pane))];
        tabsEl.replaceChildren(
          ...order.map((pane) => {
            const p = PANES[pane];
            const item = document.createElement("div");
            item.className = "tab-item";
            item.dataset.selected = String(pane === current);
            if (pane === newPane) item.dataset.new = "true";
            const slot = slotOf(pane);
            if (slot > 0 && fixed.length >= 2) {
              item.dataset.slot = String(slot);
              item.style.setProperty("--slot", `var(--color-slot-${slot})`);
            }
            item.innerHTML = `
              <button type="button" role="tab" class="tab" data-pane="${pane}"
                aria-selected="${pane === current}" data-detached="${!fixed.includes(pane)}">
                <span>${p.name}</span>
                <span class="tab-status" data-status="${p.status}" aria-hidden="true">${STATUS_ICON[p.status] ?? ""}</span>
              </button>`;
            item.querySelector(".tab").addEventListener("click", () => {
              current = pane;
              render(false);
            });
            return item;
          }),
        );
      }

      // 新しいセルを分割線から広げる。広げ終わったら目印を外し、
      // 中身の不透明度と位置を transition で戻す。
      function animateIn(cell) {
        if (cell === null) return;
        if (reduceMotion.matches) {
          cell.dataset.new = "false";
          return;
        }
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            if (!cell.isConnected) return;
            cell.style.flexGrow = "1";
            cell.dataset.new = "false";
          });
        });
      }

      function render(animate = true) {
        const newPane = animate ? panesPending : null;
        const newCell = newPane;
        stage.dataset.single = String(leafPanes(layout).length < 2);
        stage.replaceChildren(renderNode(layout, newCell));
        renderTabs(newCell);
        animateIn(newPane === null ? null : stage.querySelector(`.cell[data-pane="${newPane}"]`));
        panesPending = null;
      }

      let panesPending = null;

      function setEvent(text) {
        eventEl.innerHTML = text;
      }

      function addNext() {
        if (step >= STEPS.length) return false;
        const next = STEPS[step];
        panesPending = next.pane;
        tabs = [...tabs, next.pane];
        current = "impl";
        if (next.target !== null) layout = insertAfter(layout, next.target, next.pane, next.dir);
        step += 1;
        render(true);
        const count = leafPanes(layout).length;
        if (next.target === null) {
          setEvent(`<b>4 枚が上限</b>なので、${next.pane} はタブに追加しました（分割しない）。`);
        } else {
          const dir = next.dir === "row" ? "右" : "下";
          setEvent(`<b>${count} 枚</b>：委譲を検知して ${next.pane} を${dir}に分割しました。`);
        }
        syncControls();
        return true;
      }

      function syncControls() {
        const next = STEPS[step];
        delegateBtn.disabled = next === undefined;
        delegateBtn.textContent =
          next === undefined ? "これ以上はタブへ" : `委譲（${next.pane} へ）`;
      }

      function play() {
        resetState();
        render(false);
        syncControls();
        setEvent("1 枚表示から再生します。");
        timers.push(
          setTimeout(() => {
            addNext();
            timers.push(setTimeout(() => addNext(), 900));
            timers.push(setTimeout(() => addNext(), 1800));
            timers.push(setTimeout(() => addNext(), 2700));
          }, 450),
        );
      }

      delegateBtn.addEventListener("click", () => addNext());
      playBtn.addEventListener("click", play);
      slowBtn.addEventListener("click", () => {
        const slow = document.documentElement.dataset.slow !== "true";
        document.documentElement.dataset.slow = String(slow);
        slowBtn.setAttribute("aria-pressed", String(slow));
      });
      resetBtn.addEventListener("click", () => {
        resetState();
        render(false);
        syncControls();
        setEvent("1 枚表示。委譲はまだありません。");
      });
      themeBtn.addEventListener("click", () => {
        const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        themeBtn.textContent = next === "dark" ? "ライト" : "ダーク";
      });

      resetState();
      render(false);
      syncControls();
    </script>
  </body>
</html>
